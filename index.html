<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="todolist.css">
    <title>Todo list</title>
</head>
<body>
    <div class="container">
        <div class="to-do-app">
            <h1>Today's plan</h1>
            <p id="datee">Today's date</p>
            <input type="text" id="searchbar" placeholder="write a new task...">
            <button id="plus">+</button>
            <p id="error" style="color: red;"></p>

            <p id="todolist">TO DO LIST</p>
                

            <p id="total">0 of 4 done</p>

            <div class="notesbox" id="notesbox">
                <p id="Notes">Notes</p>
                <textarea id="notepad" placeholder="write your thoughts..."></textarea>
            </div>

        </div>
    </div>
    <script src = "todolist.js"></script>
</body>
</html>
